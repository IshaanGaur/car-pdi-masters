name: Deploy website to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate brand-model SEO pages from catalog
        run: node scripts/generate-brand-model-pages.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAR_PDI_MASTERS }}

      - name: Verify deployment service account identity
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAR_PDI_MASTERS }}
        run: |
          node -e 'const c = JSON.parse(process.env.FIREBASE_CREDENTIALS_JSON); if (!c.client_email) { throw new Error("client_email missing from deployment credentials"); } console.log("Deployment service account:", c.client_email);'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Deploy website enquiry Cloud Function
        run: firebase deploy --debug --config firebase.website.json --only functions:payments:cpmSubmitWebsiteEnquiryV1 --project car-pdi-masters --non-interactive

      - name: Deploy website Hosting after API is ready
        run: firebase deploy --config firebase.website.json --only hosting:website --project car-pdi-masters --non-interactive

      - name: Verify DLF Phase 1 on deployed hosts
        run: |
          set -euo pipefail
          url='locations/gurugram/dlf-phase-1.html'
          expected='This page covers DLF Phase 1 car PDI and inspection services; nearby Gurugram areas are listed below.'
          old='Sector 28 and MG Road showroom references'
          for host in 'https://car-pdi-masters.web.app' 'https://www.carmasters.co.in'; do
            echo "Checking $host/$url"
            body="$(curl -fsSL --retry 4 --retry-delay 2 "$host/$url")"
            if ! grep -Fq "$expected" <<<"$body"; then
              echo "ERROR: expected DLF Phase 1 text is not live on $host"
              if grep -Fq "$old" <<<"$body"; then
                echo "ERROR: old showroom-reference text is still being served on $host"
              fi
              exit 1
            fi
            if grep -Fq "$old" <<<"$body"; then
              echo "ERROR: old showroom-reference text is still present on $host"
              exit 1
            fi
            echo "OK: $host serves the new DLF Phase 1 copy"
          done

      - name: Verify brand-model SEO pages on deployed hosts
        run: |
          set -euo pipefail
          for host in 'https://car-pdi-masters.web.app' 'https://www.carmasters.co.in'; do
            for path in 'car-pdi/' 'car-pdi/maruti-suzuki/' 'car-pdi/maruti-suzuki/swift/' 'car-pdi/tata/nexon/' 'car-pdi/hyundai/creta/' 'car-pdi/volkswagen/taigun/'; do
              echo "Checking $host/$path"
              body="$(curl -fsSL --retry 5 --retry-delay 2 "$host/$path")"
              if ! grep -Eiq '<title>[^<]*(PDI|Car PDI)[^<]*</title>' <<<"$body"; then echo "ERROR: missing PDI title on $host/$path"; exit 1; fi
              if ! grep -Eiq '<h1[^>]*>[^<]*(PDI|Inspection)[^<]*</h1>' <<<"$body"; then echo "ERROR: missing PDI/Inspection H1 on $host/$path"; exit 1; fi
              if ! grep -Eiq 'rel="canonical"[^>]+href="https://www\.carmasters\.co\.in/[^" ]+/' <<<"$body"; then echo "ERROR: missing trailing-slash canonical on $host/$path"; exit 1; fi
              if ! grep -Eiq 'content="index,follow"' <<<"$body"; then echo "ERROR: missing index,follow on $host/$path"; exit 1; fi
            done
            echo "Checking $host/sitemap.xml"
            sitemap="$(curl -fsSL --retry 5 --retry-delay 2 "$host/sitemap.xml")"
            if ! grep -Fq 'https://www.carmasters.co.in/car-pdi/' <<<"$sitemap"; then echo "ERROR: model SEO root missing from sitemap on $host"; exit 1; fi
            if ! grep -Fq 'https://www.carmasters.co.in/car-pdi/maruti-suzuki/swift/' <<<"$sitemap"; then echo "ERROR: Swift model URL missing from sitemap on $host"; exit 1; fi
            echo "OK: brand-model pages and sitemap are live on $host"
          done

      - name: Verify Sohna Road SEO page on deployed hosts
        run: |
          set -euo pipefail
          url='locations/gurugram/sohna-road.html'
          expected_title='Car PDI in Sohna Road, Gurugram | New, Used, Luxury & EV Inspection'
          expected_marker='SOHNA-ROAD-DEPLOY-VERIFY'
          old_title='Car PDI on Sohna Road, Gurugram | New Car & Used Car Inspection'
          for host in 'https://car-pdi-masters.web.app' 'https://www.carmasters.co.in'; do
            echo "Checking $host/$url"
            body="$(curl -fsSL --retry 5 --retry-delay 2 "$host/$url")"
            if ! grep -Fq "$expected_title" <<<"$body"; then
              echo "ERROR: new Sohna Road title is not live on $host"
              if grep -Fq "$old_title" <<<"$body"; then echo "ERROR: old Sohna Road title is still being served on $host"; fi
              exit 1
            fi
            if ! grep -Fq "$expected_marker" <<<"$body"; then
              echo "ERROR: latest Sohna Road deployment marker is not live on $host"
              exit 1
            fi
            if grep -Fq 'verified Tata, Škoda, Maruti Suzuki and Hyundai dealer locations' <<<"$body"; then
              echo "ERROR: stale dealer-brand copy is still live on $host"
              exit 1
            fi
            if ! grep -Fq 'FAQPage' <<<"$body"; then
              echo "ERROR: FAQ schema is not live on $host"
              exit 1
            fi
            echo "OK: $host serves the new Sohna Road SEO page"
          done

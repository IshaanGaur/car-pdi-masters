name: Deploy website to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAR_PDI_MASTERS }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Deploy website enquiry Cloud Function
        run: firebase deploy --config firebase.website.json --only functions:payments:cpmSubmitWebsiteEnquiryV1 --project car-pdi-masters --non-interactive

      - name: Deploy website Hosting after API is ready
        run: firebase deploy --config firebase.website.json --only hosting:website --project car-pdi-masters --non-interactive

name: Website check

# Runs the same safety check as the Firebase publish on every change pushed to GitHub,
# so a page without the logo/menu, a WhatsApp "Book" button or a missing payment page
# shows a red cross on the commit straight away.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mirror Firebase website predeploy order so CI audits the same generated output that will be deployed.
      - run: node scripts/enhance-seo-pages.js
      - run: node scripts/generate-brand-model-pages.js
      - run: node scripts/apply-seo-meta.js
      - run: node scripts/add-new-car-pdi-links.js
      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check functions/index.js
      - run: node scripts/check-website.js
      - run: node scripts/check-brand-model-pages.js
